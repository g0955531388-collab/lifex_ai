name: lifex_ai
description: Lifex-AI Global Health Network — شبكة صحية ذكية. تحليل وإرشاد، ليست بديلاً عن الطبيب ولا تصف دواء.
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  torch_light: ^1.1.0
  flutter_tts: ^4.0.2
  speech_to_text: ^6.6.2
  geolocator: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/lifex_seal.png
    - assets/branding/lifex_seal.svg
    - assets/data/diseases_database.json
    - assets/data/medications_database.json
    - assets/data/symptoms_database.json
    - assets/data/tests_database.json
    - assets/data/camera_signs.json
